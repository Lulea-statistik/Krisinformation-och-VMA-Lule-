name: Inventera historiska krisartiklar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventera årsarkiv
        run: python scripts/inventory_archive.py
      - name: Spara kandidater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Inventory archive candidates for manual verification"
            git push
          fi
