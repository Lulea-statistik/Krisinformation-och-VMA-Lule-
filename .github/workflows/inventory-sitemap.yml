name: Inventera historiska artiklar via sitemap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera syntax
        run: python -m py_compile scripts/inventory_sitemap.py
      - name: Inventera webbkartor
        run: python scripts/inventory_sitemap.py
      - name: Spara diagnostik och kandidater
        if: always()
        run: |
          if [ -f data/sitemap_candidates.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sitemap_candidates.json
            if ! git diff --cached --quiet; then
              git commit -m "Record official sitemap history inventory"
              git pull --rebase
              git push
            fi
          fi
