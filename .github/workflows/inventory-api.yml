name: Inventera VMA-historik via API v3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera Python-syntax
        run: python -m py_compile scripts/inventory_api.py
      - name: Hämta och kvalitetsmärk API-kandidater
        run: python scripts/inventory_api.py
      - name: Spara resultatet
        if: always()
        run: |
          if [ -f data/api_candidates.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/api_candidates.json
            if ! git diff --cached --quiet; then
              git commit -m "Store API history candidates and retrieval diagnostics"
              git pull --rebase
              git push
            fi
          fi
