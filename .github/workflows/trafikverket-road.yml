name: Uppdatera Trafikverkets vägtrafikinformation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trafikverket_road.py'
      - 'tests/test_trafikverket_road.py'
      - '.github/workflows/trafikverket-road.yml'
  schedule:
    - cron: '6,21,36,51 * * * *'
permissions:
  contents: write
concurrency:
  group: trafikverket-road
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera kod och tester
        run: |
          python -m py_compile scripts/trafikverket_road.py
          python -m unittest discover -s tests -p 'test_trafikverket_road.py' -v
      - name: Hämta Trafikverket Situation 1.5
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
        run: python scripts/trafikverket_road.py
      - name: Publicera uppdaterad trafikstatus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trafikverket_road.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Trafikverket road traffic status"
            git pull --rebase
            git push
          fi
